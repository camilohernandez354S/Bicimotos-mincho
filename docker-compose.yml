version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: bicimotos-postgres
    environment:
      POSTGRES_DB: bicimotos_mincho
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bicimotos-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bicimotos-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bicimotos_mincho
      DB_USER: postgres
      DB_PASSWORD: password123
      JWT_SECRET: tu_jwt_secret_super_seguro_cambiar_en_produccion
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - bicimotos-network
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bicimotos-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bicimotos-network
    restart: unless-stopped

  # Nginx (opcional para producción)
  nginx:
    image: nginx:alpine
    container_name: bicimotos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - bicimotos-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bicimotos-network:
    driver: bridge