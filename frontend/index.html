<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: el logo de Bicimotos como ícono de pestaña -->
    <link rel="icon" type="image/jpeg" href="/img/logo.jpg" />
    <link rel="apple-touch-icon" href="/img/logo.jpg" />

    <!-- Color de la barra del browser en mobile (naranja Bicimotos) -->
    <meta name="theme-color" content="#f97316" />

    <!-- Defaults — cada página los puede sobreescribir con usePageMeta() -->
    <title>Bicimotos Mincho — Bicicletas, accesorios y componentes</title>
    <meta
      name="description"
      content="Catálogo de bicicletas, marcos, accesorios y componentes de Bicimotos Mincho. Consultá por WhatsApp."
    />

    <!-- Open Graph: previsualización cuando alguien comparte el link en redes -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bicimotos Mincho" />
    <meta property="og:title" content="Bicimotos Mincho" />
    <meta
      property="og:description"
      content="Bicicletas, marcos, accesorios y componentes. Consultá por WhatsApp."
    />
    <meta property="og:image" content="/img/logo.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
